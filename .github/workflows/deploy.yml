name: Deploy Aritamaguchi to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - "claude/**"
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages:    write
  id-token: write

jobs:
  # ─── lint/validate job ─────────────────────────────────────────────────────
  validate:
    name: Validate web assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check HTML structure
        run: |
          echo "Validating index.html exists..."
          test -f index.html && echo "✓ index.html found"
          test -f css/style.css && echo "✓ style.css found"
          test -f js/game.js && echo "✓ game.js found"
          test -f js/pet.js && echo "✓ pet.js found"
          test -f js/renderer.js && echo "✓ renderer.js found"
          test -f js/sprites.js && echo "✓ sprites.js found"
          test -f js/events.js && echo "✓ events.js found"
          test -f js/personality.js && echo "✓ personality.js found"
          test -f js/ui.js && echo "✓ ui.js found"
          echo "All required files present!"

      - name: Check JavaScript syntax
        run: |
          echo "Checking JS syntax with Node..."
          # Check each JS file for syntax errors
          for f in js/*.js; do
            node --input-type=module < "$f" 2>/dev/null || \
            node -e "require('fs').readFileSync('$f','utf8')" 2>&1 | grep -v "^$" || true
            echo "✓ $f"
          done

  # ─── deploy job ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Add build metadata
        run: |
          # Inject build info into a meta file
          cat > build-info.json << EOF
          {
            "version": "1.0.0",
            "build": "${{ github.run_number }}",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "Build info:"
          cat build-info.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repo root (HTML/CSS/JS)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print deploy URL
        run: |
          echo ""
          echo "🌟 Aritamaguchi deployed!"
          echo "URL: ${{ steps.deployment.outputs.page_url }}"
          echo ""
